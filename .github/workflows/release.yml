name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned universal ZIP + DMG
        run: scripts/release-unsigned.sh

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION = ' launch.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([^;]+);/\1/' | tr -d ' ')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION = ' launch.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([^;]+);/\1/' | tr -d ' ')
          test -n "$VERSION" && test -n "$BUILD"
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION" || {
              echo "::error::tag $TAG_VERSION != MARKETING_VERSION $VERSION"
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        id: sums
        run: |
          ZIP=$(ls build/release/launch-*.zip | head -1)
          DMG=$(ls build/release/launch-*.dmg | head -1)
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "zip_size=$(stat -f%z "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$(stat -f%z "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Install ossutil
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then OSSUTIL_ARCH=arm64; else OSSUTIL_ARCH=amd64; fi
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/current/ossutil-mac-${OSSUTIL_ARCH}.zip"
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil_bin
          echo "/tmp/ossutil_bin/ossutil-mac-${OSSUTIL_ARCH}" >> "$GITHUB_PATH"

      - name: Upload to Aliyun OSS
        env:
          OSS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP_PATH: ${{ steps.sums.outputs.zip_path }}
          DMG_PATH: ${{ steps.sums.outputs.dmg_path }}
        run: |
          LATEST=(-i "$OSS_KEY_ID" -k "$OSS_KEY_SECRET" -e oss-cn-shanghai.aliyuncs.com -f --meta Cache-Control:no-cache)
          # 只保留稳定地址：launch.dmg 给用户下载，launch.zip 给自动更新
          ossutil cp "$ZIP_PATH" "oss://4kdownlebucket/launch/macos/latest/launch.zip" "${LATEST[@]}"
          ossutil cp "$DMG_PATH" "oss://4kdownlebucket/launch/macos/latest/launch.dmg" "${LATEST[@]}"

      - name: Notify release API
        env:
          OSS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          API_BASE: ${{ secrets.API_BASE }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          ZIP_SHA: ${{ steps.sums.outputs.zip_sha }}
          ZIP_SIZE: ${{ steps.sums.outputs.zip_size }}
          DMG_SHA: ${{ steps.sums.outputs.dmg_sha }}
          DMG_SIZE: ${{ steps.sums.outputs.dmg_size }}
        run: |
          test -n "$RELEASE_TOKEN"
          API_BASE="${API_BASE:-http://8.153.99.239:3000}"
          BASE="https://4kdownlebucket.oss-cn-shanghai.aliyuncs.com"
          ZIP_URL="${BASE}/launch/macos/latest/launch.zip"
          DMG_URL="${BASE}/launch/macos/latest/launch.dmg"
          CHANGELOG=$(git log -1 --pretty=%s)
          export VERSION BUILD ZIP_SHA ZIP_SIZE ZIP_URL DMG_URL CHANGELOG
          python3 - <<'PY'
          import json
          import os

          manifest = {
              "product": "launch",
              "platform": "macos",
              "version": os.environ["VERSION"],
              "build": int(os.environ["BUILD"]),
              "url": os.environ["ZIP_URL"],
              "dmg_url": os.environ["DMG_URL"],
              "sha256": os.environ["ZIP_SHA"],
              "size": int(os.environ["ZIP_SIZE"]),
              "changelog": os.environ.get("CHANGELOG", ""),
              "force": False,
          }
          open("/tmp/publish.json", "w", encoding="utf-8").write(json.dumps(manifest, ensure_ascii=False))
          PY
          curl -fsS -X POST "$API_BASE/api/internal/releases/publish" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: $RELEASE_TOKEN" \
            --data-binary @/tmp/publish.json
